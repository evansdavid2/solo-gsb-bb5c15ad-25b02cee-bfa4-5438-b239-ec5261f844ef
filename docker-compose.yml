services:
  app:
    build: .
    image: verifiable-draw
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_PATH: /data/draws.db
    volumes:
      - draw-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  draw-data:
